name: DocMind Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. BACKEND TYPE CHECK & TESTS ──────────────────────────────────────────
  backend-checks:
    name: Backend Pyright & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docmind_test
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libpq-dev

      - name: Install Python Dependencies & Pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio
          npm install -g pyright

      - name: Run Pyright Type Checking (0 errors allowed)
        run: |
          npx pyright backend/

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://docmind:testpassword@localhost:5432/docmind_test
          SYNC_DATABASE_URL: postgresql+psycopg2://docmind:testpassword@localhost:5432/docmind_test
          APP_SECRET_KEY: test-secret-key-at-least-32-characters-long!
        run: |
          PYTHONPATH=backend pytest -v backend/tests/

  # ─── 2. FRONTEND BUILD VERIFICATION (FOR VERCEL) ─────────────────────────────
  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Static Export Build
        run: |
          cd frontend
          npm run build

  # ─── 3. CONTINUOUS DEPLOYMENT TO BLUEHOST VPS ────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Bluehost VPS
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Bluehost
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BLUEHOST_HOST }}
          username: ${{ secrets.BLUEHOST_USER }}
          key: ${{ secrets.BLUEHOST_SSH_KEY }}
          port: ${{ secrets.BLUEHOST_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.BLUEHOST_APP_DIR || '/var/www/docmind' }}"
            echo "[INFO] Navigating to application directory: ${APP_DIR}"
            if [ ! -d "${APP_DIR}" ]; then
              echo "[ERROR] Application directory ${APP_DIR} does not exist on Bluehost!"
              exit 1
            fi
            cd "${APP_DIR}"
            echo "[INFO] Fetching latest commit from main..."
            git fetch origin main
            git reset --hard origin/main
            chmod +x infra/scripts/deploy.sh
            bash infra/scripts/deploy.sh

